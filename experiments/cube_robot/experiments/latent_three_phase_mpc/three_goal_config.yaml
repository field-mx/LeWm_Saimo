paths:
  model_dir: ../../model/lewm-cube-mapped
  action_dataset: ../../data/ogbench_state/cube-single-play-v0.npz
  source_dataset: outputs/data/recovery_semantic_latents.npz
  output_dir: outputs/three_goal_state_machine_v1

seed: 42
device: cuda
image_size: 224

task:
  name: three_goal_recovery_cube
  init_xyz: [0.40, -0.15, 0.02]
  goal_xyz: [0.35, 0.20, 0.02]

model:
  latent_dim: 192
  hidden_dim: 384
  action_dim: 5
  action_block: 5
  state_count: 3
  predicate_count: 6
  value_ensemble_size: 2

dataset:
  complete_lookahead_steps: 25
  state_repeat_factors: [2, 8, 1]

training:
  epochs: 80
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.00001
  validation_fraction: 0.20
  gamma: 0.97
  target_tau: 0.01
  semantic_coefficient: 2.0
  target_coefficient: 2.0
  actor_coefficient: 1.0
  critic_coefficient: 1.0
  step_penalty: 0.01
  state_transition_reward: 0.25
  recovery_penalty: 0.05
  success_reward: 1.0
  max_positive_weight: 30.0
  max_grad_norm: 1.0

planner:
  num_candidates: 96
  horizon_blocks: 5
  exploration_std: 0.08
  exploration_decay: 0.98
  execute_steps_by_state: [1, 1, 1]
  short_target_coefficient: 0.75
  terminal_value_coefficient: 0.9
  trajectory_value_coefficient: 0.20
  uncertainty_coefficient: 0.20
  action_prior_coefficient: 6.0
  action_smoothness_coefficient: 0.01
  action_blend: [0.15, 0.15, 0.10, 0.05, 0.0]
  elite_count: 8
  elite_temperature: 0.05

state_machine:
  aligned_enter_threshold: 0.65
  aligned_exit_threshold: 0.35
  grasped_enter_threshold: 0.70
  grasp_attempt_steps: 8 # close and verify for at most this many RGB steps
  grasp_reset_open_steps: 4 # force an open-gripper reset before re-alignment
  grasped_exit_threshold: 0.40
  near_goal_threshold: 0.65
  released_threshold: 0.65
  complete_threshold: 0.90
  transition_consecutive_frames: 1
  loss_consecutive_frames: 2
  complete_consecutive_frames: 3
  transition_cooldown_steps: 2
  max_state_steps: [60, 35, 100]

online_training:
  enabled: true
  episodes: 10
  max_steps: 180
  seed_offset: 13000
  learning_rate: 0.000001
  updates_per_step: 1
  replay_capacity: 4096
  warmup_samples: 8
  batch_size: 64
  minimum_planner_advantage: 0.01
  minimum_value_progress: 0.0
  minimum_semantic_progress: 0.005
  bc_anchor_coefficient: 1.0
  max_grad_norm: 1.0
  fps: 20
