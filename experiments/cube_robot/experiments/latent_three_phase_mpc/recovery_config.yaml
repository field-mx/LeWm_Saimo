paths:
  model_dir: ../../model/lewm-cube-mapped
  coordinate_actor_checkpoint: ../actor_semantic_mpc/outputs/checkpoints/semantic_actor.pt
  action_dataset: ../../data/ogbench_state/cube-single-play-v0.npz
  cube_semantic_dataset: ../../data/ogbench_state/cube-single-play-v0.npz
  cube_semantic_cache: outputs/data/cube_semantic_latents.npz
  cube_semantic_source_checkpoint: outputs/checkpoints/recovery_temporal_proprio_strict_round3_actor_final.pt
  cube_semantic_checkpoint: outputs/checkpoints/recovery_cube_semantic_actor.pt
  output_dir: outputs

seed: 42
device: cuda
image_size: 224

task:
  name: latent_recovery_cube
  init_xyz: [0.40, -0.15, 0.02]
  goal_xyz: [0.35, 0.20, 0.02]

teacher:
  episodes: 48
  max_steps: 160
  seed_offset: 15000
  action_noise_std: 0.02
  reuse_dataset: true
  above_offset_m: 0.16
  xy_alignment_m: 0.04
  xyz_alignment_m: 0.025
  contact_threshold: 0.50
  transport_height_m: 0.14
  lift_target_height_m: 0.36
  goal_xy_m: 0.04
  goal_xyz_m: 0.04
  release_contact_threshold: 0.25
  retreat_distance_m: 0.10
  retreat_height_m: 0.16
  stable_complete_frames: 3

model:
  latent_dim: 192
  hidden_dim: 384
  action_dim: 5
  action_block: 5
  state_count: 5
  predicate_count: 6
  value_ensemble_size: 2
  proprio_dim: 3 # normalized end-effector XYZ from the current robot state
  proprio_action_scale: [0.5, 0.5, 0.5]
  proprio_min: [-3.0, -5.0, 0.0]
  proprio_max: [3.0, 5.0, 5.0]

training:
  epochs: 80
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.00001
  validation_fraction: 0.20
  gamma: 0.97
  target_tau: 0.01
  semantic_coefficient: 2.0
  target_coefficient: 2.0
  actor_coefficient: 1.0
  critic_coefficient: 1.0
  step_penalty: 0.01
  state_transition_reward: 0.25
  recovery_penalty: 0.05
  success_reward: 1.0
  max_positive_weight: 30.0
  max_grad_norm: 1.0

# Pretrain the existing VisualSemanticNet on broad Cube demonstrations. The
# network architecture is unchanged; only its training data is expanded.
cube_semantic_training:
  samples_per_episode: 64 # 64,000 samples across all 1,000 Cube episodes
  min_goal_offset: 25
  max_goal_offset: 100
  render_encode_batch_size: 128
  epochs: 30
  batch_size: 512
  learning_rate: 0.0001
  weight_decay: 0.00001
  validation_fraction: 0.10
  max_positive_weight: 30.0
  max_grad_norm: 1.0

planner:
  num_candidates: 96
  horizon_blocks: 5
  exploration_std: 0.08
  exploration_decay: 0.98
  execute_steps_by_state: [1, 1, 1, 1, 1]
  short_target_coefficient: 0.75
  terminal_value_coefficient: 0.9
  trajectory_value_coefficient: 0.20
  uncertainty_coefficient: 0.20
  action_prior_coefficient: 6.0
  action_smoothness_coefficient: 0.01
  action_blend: [0.15, 0.15, 0.10, 0.05, 0.0]
  elite_count: 8
  elite_temperature: 0.05

state_machine:
  predicate_thresholds: [0.65, 0.65, 0.65, 0.65, 0.70, 0.90]
  transition_consecutive_frames: 2
  complete_consecutive_frames: 2
  transition_cooldown_steps: 2
  max_state_steps: [60, 60, 60, 60, 60]
  no_progress_patience: 15

# RGB reference rendered by the privileged simulator only once before evaluation.
# It captures the first frame where the gripper is still holding the cube and
# the cube is inside the task goal. Inference compares real RGB latents against
# this reference and never observes cube coordinates.
transfer_goal:
  reference_seed: 15000
  max_steps: 160
  latent_mse_threshold: 0.017

online_training:
  enabled: true
  episodes: 10
  max_steps: 300
  seed_offset: 11000
  learning_rate: 0.000001
  updates_per_step: 1
  replay_capacity: 4096
  warmup_samples: 8
  batch_size: 64
  minimum_planner_advantage: 0.01
  minimum_value_progress: 0.0
  minimum_semantic_progress: 0.005
  bc_anchor_coefficient: 1.0
  max_grad_norm: 1.0
  fps: 20
