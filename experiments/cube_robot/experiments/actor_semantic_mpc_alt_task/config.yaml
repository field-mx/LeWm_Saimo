paths:
  model_dir: ../../model/lewm-cube-mapped
  actor_checkpoint: ../../outputs/actor_bc/actor_best.pt
  action_dataset: ../../data/ogbench_state/cube-single-play-v0.npz
  output_dir: ../actor_semantic_mpc_alt_task/outputs

seed: 42
device: cuda
image_size: 224

task:
  name: alternate_reverse_diagonal
  init_xyz: [0.40, -0.15, 0.02]
  goal_xyz: [0.35, 0.20, 0.02]

planner:
  control_mode: phase_aware
  num_candidates: 128
  horizon_blocks: 5
  action_block: 5
  execute_steps: 1
  exploration_std: 0.08
  temporal_correlation: 0.65
  min_model_improvement: 0.05
  max_first_action_delta: 0.60

semantics:
  above_offset_m: 0.16
  xy_alignment_m: 0.04
  xyz_alignment_m: 0.025
  contact_threshold: 0.50
  transport_height_m: 0.14
  goal_xy_m: 0.04
  goal_xyz_m: 0.04
  minimum_progress_m: 0.0005
  minimum_gripper_progress: 0.015
  maximum_regression_m: 0.01

adaptation:
  enabled: true
  training_episodes: 1
  max_steps: 250
  seed_offset: 4000
  learning_rate: 0.00001
  updates_per_accept: 1
  verified_batch_size: 64
  replay_capacity: 4096
  warmup_verified_samples: 8
  anchor_pool_size: 20000
  anchor_batch_size: 128
  bc_anchor_coefficient: 0.25
  max_grad_norm: 1.0

evaluation:
  episodes: 1
  max_steps: 250
  seed_offset: 4000
  fps: 20
